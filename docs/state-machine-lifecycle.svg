<?xml version="1.0" encoding="utf-8"?>
<svg width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-label="Room phase lifecycle diagram">
<rect x="0" y="0" width="1200" height="670" fill="#ffffff"/>

  <!-- main rail nodes -->
  <g>
    <rect x="20"  y="150" width="180" height="92" rx="12" fill="#e8f1fd" stroke="#2f6fed" stroke-width="2"/>
    <text x="110" y="182" text-anchor="middle" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">RECON</text>
    <text x="110" y="201" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">no approval yet</text>
    <text x="110" y="217" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">RECON briefs filed</text>

    <rect x="250" y="150" width="180" height="92" rx="12" fill="#e8f1fd" stroke="#2f6fed" stroke-width="2"/>
    <text x="340" y="182" text-anchor="middle" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">IMPL</text>
    <text x="340" y="201" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">dev engaged</text>
    <text x="340" y="217" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">IMPL order live</text>

    <rect x="480" y="150" width="180" height="92" rx="12" fill="#e8f1fd" stroke="#2f6fed" stroke-width="2"/>
    <text x="570" y="182" text-anchor="middle" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">VERIFY</text>
    <text x="570" y="201" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">qe + auditor engaged</text>
    <text x="570" y="217" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">TESTING + audit</text>

    <rect x="710" y="150" width="180" height="92" rx="12" fill="#e8f1fd" stroke="#2f6fed" stroke-width="2"/>
    <text x="800" y="182" text-anchor="middle" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">CLOSE-OUT</text>
    <text x="800" y="201" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">stored: CLOSING</text>
    <text x="800" y="217" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">merge-close runs</text>

    <rect x="940" y="150" width="180" height="92" rx="12" fill="#e6f6ec" stroke="#1e7e46" stroke-width="2"/>
    <text x="1030" y="182" text-anchor="middle" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">CLOSED</text>
    <text x="1030" y="201" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">terminal · observed</text>
    <text x="1030" y="217" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">never originated</text>
  </g>

  <!-- main rail edges -->
  <g stroke="#2f6fed" stroke-width="2" fill="none">
    <line x1="200" y1="196" x2="246" y2="196"/>
    <line x1="430" y1="196" x2="476" y2="196"/>
    <line x1="660" y1="196" x2="706" y2="196"/>
    <line x1="890" y1="196" x2="936" y2="196"/>
  </g>
  <g>
    <text x="225" y="272" text-anchor="middle" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="12">T1 · dev READY + plan APPROVED</text>
    <text x="225" y="290" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">→ file IMPL order + ring</text>
    <text x="435" y="272" text-anchor="middle" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="12">T3 · DONE + tip arrives</text>
    <text x="355" y="290" text-anchor="start" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">→ TESTING order to QE</text>
    <text x="690" y="272" text-anchor="middle" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="12">T5 · APPROVED arrives</text>
    <text x="685" y="290" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">era clean → merge-close</text>
    <text x="900" y="272" text-anchor="middle" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="12">T6 · issue closed</text>
    <text x="900" y="290" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">observed, poll ≤ every 5 ticks</text>
  </g>

  <!-- era re-open (dashed, above rail) -->
  <g stroke="#c96a1b" stroke-width="1.6" stroke-dasharray="7 5" fill="none">
    <path d="M 800 150 C 760 96, 660 96, 610 146"/>
  </g>
  <text x="705" y="100" text-anchor="middle" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="12">T8 · era re-opened</text>
  <text x="705" y="84" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">new approval / READY observed, postdates DONE</text>

  <!-- testing-only badge on VERIFY -->
  <g>
    <text x="640" y="315" text-anchor="start" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">T11 · VERIFIED w/o verdict (testing-only)</text>
  </g>

  <!-- FEEDBACK -->
  <g>
    <rect x="365" y="430" width="180" height="92" rx="12" fill="#fdf0e7" stroke="#c96a1b" stroke-width="2"/>
    <text x="455" y="462" text-anchor="middle" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">FEEDBACK</text>
    <text x="455" y="481" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">CHANGES / no evidence</text>
    <text x="455" y="497" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">recoverable → re-brief</text>
  </g>
  <g stroke="#c96a1b" stroke-width="1.8" fill="none">
    <path d="M 545 242 L 505 426"/>
  </g>
  <text x="480" y="345" text-anchor="end" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="12">T7 · CHANGES arrives</text>
  <g stroke="#c96a1b" stroke-width="1.6" stroke-dasharray="7 5" fill="none">
    <path d="M 405 430 L 360 250"/>
  </g>
  <text x="330" y="340" text-anchor="end" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="12">re-brief → IMPL</text>

  <!-- HALTED -->
  <g>
    <rect x="620" y="430" width="180" height="92" rx="12" fill="#fdf0e7" stroke="#c96a1b" stroke-width="2"/>
    <text x="710" y="462" text-anchor="middle" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">HALTED</text>
    <text x="710" y="481" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">budget spent / halt</text>
    <text x="710" y="497" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">no actions (T9)</text>
  </g>
  <g stroke="#c96a1b" stroke-width="1.6" stroke-dasharray="7 5" fill="none">
    <path d="M 600 242 L 660 426"/>
  </g>
  <text x="615" y="368" text-anchor="end" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="12">T9 · budget spent / halt set</text>
  <g stroke="#5b6b82" stroke-width="1.4" stroke-dasharray="4 4" fill="none">
    <path d="M 620 476 L 440 300 L 432 246"/>
  </g>
  <text x="500" y="400" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">halt cleared → resume NEXT</text>

  <!-- RETIRED -->
  <g>
    <rect x="940" y="430" width="180" height="92" rx="12" fill="#e9edf1" stroke="#59616e" stroke-width="2"/>
    <text x="1030" y="462" text-anchor="middle" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">RETIRED</text>
    <text x="1030" y="481" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">branches deleted</text>
    <text x="1030" y="497" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">room removed (T12)</text>
  </g>
  <g stroke="#59616e" stroke-width="2" fill="none">
    <line x1="1030" y1="242" x2="1030" y2="426"/>
  </g>
  <text x="1018" y="340" text-anchor="end" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="12">T12 · operator clean, guards pass</text>

  <!-- operator rail note -->
  <g>
    <rect x="20" y="430" width="270" height="92" rx="12" fill="#eef3f6" stroke="#5b6b82" stroke-width="1.4" stroke-dasharray="8 5"/>
    <text x="155" y="462" text-anchor="middle" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">OPERATOR (T10)</text>
    <text x="155" y="481" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">operator writes DECISION: on issue</text>
    <text x="155" y="497" text-anchor="middle" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">engine relays verbatim, lane resumes</text>
  </g>
  <g stroke="#5b6b82" stroke-width="1.4" stroke-dasharray="8 5" fill="none">
    <path d="M 290 462 L 361 462"/>
  </g>

  <g>
    <polygon points="234,190 234,202 246,196" fill="#2f6fed"/>
    <polygon points="464,190 464,202 476,196" fill="#2f6fed"/>
    <polygon points="694,190 694,202 706,196" fill="#2f6fed"/>
    <polygon points="924,190 924,202 936,196" fill="#2f6fed"/>
    <polygon points="1024,414 1036,414 1030,426" fill="#59616e"/>
    <polygon points="602,136 618,136 610,148" fill="#c96a1b"/>
    <polygon points="514,413 502,411 505,428" fill="#c96a1b"/>
    <polygon points="369,262 357,265 360,250" fill="#c96a1b"/>
    <polygon points="662,411 650,414 660,426" fill="#c96a1b"/>
    <polygon points="426,260 438,260 432,246" fill="#59616e"/>
    <polygon points="349,456 349,468 361,462" fill="#59616e"/>
    <polygon points="104,134 116,134 110,146" fill="#59616e"/>
  </g>
  <g>
    <text x="20" y="32" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700">Room lifecycle — external stimulus → engine action → new state</text>
    <text x="150" y="54" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="12">Read each arrow tail-to-head. Solid = transition taken on the tick the stimulus is seen. Dashed = guard rail.</text>
    <circle cx="110" cy="78" r="26" fill="#eef3f6" stroke="#5b6b82" stroke-width="2"/>
    <text x="110" y="84" text-anchor="middle" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700">START</text>
    <line x1="110" y1="106" x2="110" y2="146" stroke="#59616e" stroke-width="2"/>
    <text x="122" y="124" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="12">operator runs setup</text>
    <text x="122" y="140" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">room + briefs created</text>
  </g>
  <g>
    <rect x="20" y="545" width="440" height="105" rx="10" fill="#ffffff" stroke="#59616e" stroke-width="1.4"/>
    <text x="36" y="568" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700">How to read</text>
    <line x1="36" y1="584" x2="96" y2="584" stroke="#2f6fed" stroke-width="2"/>
    <polygon points="84,578 84,590 96,584" fill="#2f6fed"/>
    <text x="106" y="588" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="11">transition: stimulus → action → new state</text>
    <line x1="36" y1="604" x2="96" y2="604" stroke="#59616e" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="106" y="608" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="11">guard rail: re-open · feedback · halt · retire · resume</text>
    <rect x="36" y="618" width="12" height="12" fill="#e8f1fd" stroke="#2f6fed"/>
    <text x="54" y="628" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">phase</text>
    <rect x="122" y="618" width="12" height="12" fill="#e6f6ec" stroke="#1e7e46"/>
    <text x="140" y="628" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">terminal</text>
    <rect x="222" y="618" width="12" height="12" fill="#fdf0e7" stroke="#c96a1b"/>
    <text x="240" y="628" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">recoverable</text>
    <rect x="336" y="618" width="12" height="12" fill="#e9edf1" stroke="#59616e"/>
    <text x="354" y="628" fill="#5b6b82" font-family="Helvetica,Arial,sans-serif" font-size="11">housekeeping</text>
  </g>
  <g>
    <rect x="640" y="545" width="520" height="105" rx="10" fill="#ffffff" stroke="#59616e" stroke-width="1.4"/>
    <text x="656" y="568" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700">What can arrive from outside</text>
    <text x="656" y="588" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="11">inbox posts: READY / NEED / NOTE / DECISION :: text (+ STATE: / NEXT: / ACK:)</text>
    <text x="656" y="602" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="11">operator on the issue: DECISION: &lt;choice&gt; · halt=true · clean</text>
    <text x="656" y="616" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="11">GitHub: audit / testing labels · closed flag (observed, polled)</text>
    <text x="656" y="630" fill="#1a2333" font-family="Helvetica,Arial,sans-serif" font-size="11">timers: order ack-by +900s · done-by +1800s · auditor SLA · 3 quiet cycles</text>
  </g>

</svg>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NexIOS RTOS — Kernel Architecture</title>
<style>
  body { background:#020617; color:#e2e8f0; font-family:'JetBrains Mono',Menlo,monospace;
         display:flex; flex-direction:column; align-items:center; margin:0; padding:40px 20px; }
  h1 { font-size:20px; font-weight:600; letter-spacing:1px; }
  h1 .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#34d399;
            margin-right:10px; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .sub { color:#64748b; font-size:11px; margin-bottom:28px; }
  svg text { font-family:'JetBrains Mono',monospace; }
</style>
</head>
<body>
<h1><span class="dot"></span>NexIOS RTOS — KERNEL ARCHITECTURE</h1>
<div class="sub">capability-based hard real-time microkernel · freestanding C++20 · x86_64</div>

<svg width="1180" height="1020" viewBox="0 0 1180 1020">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
    <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
  </marker>
  <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
    <path d="M0,0 L7,3 L0,6 Z" fill="#22d3ee"/>
  </marker>
  <marker id="arrRose" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
    <path d="M0,0 L7,3 L0,6 Z" fill="#fb7185"/>
  </marker>
</defs>

<rect width="1180" height="1020" fill="#020617"/>
<rect width="1180" height="1020" fill="url(#grid)"/>

<!-- ============ ARROWS (behind boxes) ============ -->
<!-- user ELF -> syscall gate -->
<line x1="590" y1="128" x2="590" y2="176" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrRose)"/>
<!-- syscall -> core subsystems -->
<line x1="500" y1="236" x2="330" y2="300" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrRose)"/>
<line x1="590" y1="240" x2="590" y2="300" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrRose)"/>
<line x1="680" y1="236" x2="850" y2="300" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrRose)"/>
<!-- CSpace gates IPC + VMM -->
<line x1="245" y1="380" x2="245" y2="430" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="935" y1="380" x2="935" y2="430" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>

<line x1="850" y1="700" x2="850" y2="800" stroke="#fbbf24" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- irq path -->
<path d="M 1050 340 L 1050 660 L 900 690" fill="none" stroke="#fb923c" stroke-width="1.2" marker-end="url(#arr)"/>

; NexIOS picolibc cross file — x86_64-elf freestanding (issue #72).
; c_args track the kernel/userspace interrupt-safety flags (Makefile
; CXXFLAGS/CCFLAGS x86_64 blocks: -mno-red-zone et al.).

[binaries]
c = 'x86_64-elf-gcc'
ar = 'x86_64-elf-ar'
as = 'x86_64-elf-as'
ld = 'x86_64-elf-ld'
objcopy = 'x86_64-elf-objcopy'
strip = 'x86_64-elf-strip'

[host_machine]
system = 'none'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

; NOTE: -mgeneral-regs-only is deliberately OMITTED (deviation from
; kernel CCFLAGS, issue #72): picolibc/libm pass doubles in XMM
; registers (vstrfmon.c va_arg(double) fails with SSE disabled), and
; user tasks own a kernel-managed FPU context (v0.4.3 #93), so XMM use
; in Ring 3 is safe. -mno-red-zone is kept (stack discipline parity).
[properties]
c_args = ['-m64', '-mno-red-zone', '-mcmodel=large', '-static', '-nostdlib', '-ffreestanding', '-O2', '-ffunction-sections', '-fdata-sections']
c_link_args = ['-nostdlib', '-static']

[built-in options]
c_std = 'c17'

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">NexIOS actual implementation overview</title>
  <desc id="desc">Hybrid system diagram: user mode on the left (shell, user ELF applications, optional service protection domains), kernel mode on the right behind a syscall/trap entry (scheduler, timing guards, IPC and capabilities, memory management, in-kernel VFS and drivers, architecture layer), and hardware below both.</desc>
  <defs>
    <style><![CDATA[
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #0d1b2a; }
      .title { font-size: 36px; font-weight: 700; }
      .subtitle { font-size: 20px; font-weight: 600; fill: #35508f; }
      .label { font-size: 22px; font-weight: 700; }
      .small { font-size: 17px; font-weight: 600; }
      .tiny { font-size: 15px; font-weight: 600; }
      .side { font-size: 15px; font-weight: 600; fill: #475569; }
      .kernelbox { fill: #dfe9ff; stroke: #496ec7; stroke-width: 3; }
      .userbox { fill: #eafaf1; stroke: #4fb36d; stroke-width: 3; }
      .bigbox { fill: #edf4ff; stroke: #7aa7ff; stroke-width: 3; }
      .optionalbox { fill: #fff7df; stroke: #d8a93c; stroke-width: 3; stroke-dasharray: 10 8; }
      .optchip { fill: #fffaf0; stroke: #d7b15c; stroke-width: 2; }
      .chip { fill: #dfe9ff; stroke: #496ec7; stroke-width: 2; }
      .hardware { fill: #f1e8ff; stroke: #8a68d6; stroke-width: 3; }
      .note { fill: #ffffff; stroke: #9aa6bf; stroke-width: 1.5; }
      .userarrow { stroke: #2e8b57; stroke-width: 3; fill: none; }
      .kernelarrow { stroke: #3558be; stroke-width: 3; fill: none; }
      .dashed { stroke: #5b6b7c; stroke-width: 2.4; fill: none; stroke-dasharray: 12 10; }
    ]]></style>
    <marker id="arrowheadGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#2e8b57"/>
    </marker>
    <marker id="arrowheadBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#3558be"/>
    </marker>
  </defs>

  <rect width="1600" height="1010" fill="#f5f7fb"/>
  <text x="800" y="46" text-anchor="middle" class="title">NexIOS — actual implementation overview</text>
  <text x="800" y="80" text-anchor="middle" class="subtitle">Hybrid kernel in transition toward a capability-based microkernel</text>

  <!-- ================= USER MODE ================= -->
  <rect x="40" y="110" width="500" height="640" rx="18" class="userbox"/>
  <text x="290" y="150" text-anchor="middle" class="label">USER MODE</text>
  <text x="290" y="175" text-anchor="middle" class="tiny">unprivileged: EL0 / U-mode / Ring 3</text>

  <rect x="70" y="200" width="440" height="100" rx="14" class="bigbox"/>
  <text x="290" y="235" text-anchor="middle" class="label">Shell / CLI</text>
  <text x="290" y="258" text-anchor="middle" class="small">userspace/sh.c</text>
  <text x="290" y="282" text-anchor="middle" class="tiny">launches ELF tasks, shell builtins</text>

  <rect x="70" y="320" width="440" height="130" rx="14" class="bigbox"/>
  <text x="290" y="355" text-anchor="middle" class="label">User ELF applications</text>
  <text x="290" y="380" text-anchor="middle" class="small">own address space per task (MMU)</text>
  <text x="290" y="405" text-anchor="middle" class="tiny">syscalls · IPC · shared memory</text>
  <text x="290" y="428" text-anchor="middle" class="tiny">capability-mediated resource access</text>

  <rect x="70" y="470" width="440" height="260" rx="14" class="optionalbox"/>
  <text x="290" y="505" text-anchor="middle" class="label">Optional service PDs / daemons</text>
  <text x="290" y="530" text-anchor="middle" class="tiny">planned / gated, default off</text>
  <rect x="95" y="550" width="185" height="56" rx="10" class="optchip"/>
  <text x="187" y="585" text-anchor="middle" class="small">vfsd.c</text>
  <rect x="300" y="550" width="185" height="56" rx="10" class="optchip"/>
  <text x="392" y="585" text-anchor="middle" class="small">iocd.c</text>
  <rect x="95" y="622" width="185" height="56" rx="10" class="optchip"/>
  <text x="187" y="657" text-anchor="middle" class="small">cap-broker</text>
  <rect x="300" y="622" width="185" height="56" rx="10" class="optchip"/>
  <text x="392" y="657" text-anchor="middle" class="small">driver PDs</text>
  <text x="290" y="710" text-anchor="middle" class="tiny">PD = protection domain (userspace service)</text>

  <!-- ================= BOUNDARY ================= -->
  <line x1="580" y1="120" x2="580" y2="750" class="dashed"/>
  <text x="580" y="102" text-anchor="middle" class="side">privilege boundary</text>

  <!-- ================= KERNEL MODE ================= -->
  <rect x="620" y="110" width="940" height="640" rx="18" class="kernelbox"/>
  <text x="1090" y="150" text-anchor="middle" class="label">KERNEL MODE</text>
  <text x="1090" y="175" text-anchor="middle" class="tiny">privileged: EL1 / S-mode / Ring 0</text>

  <!-- syscall / trap entry bar -->
  <rect x="640" y="200" width="110" height="530" rx="14" class="bigbox"/>
  <text x="682" y="465" text-anchor="middle" class="label" transform="rotate(-90 682 465)">SYSCALL / TRAP ENTRY</text>
  <text x="722" y="465" text-anchor="middle" class="tiny" transform="rotate(-90 722 465)">pointer / argument / ELF / VFS boundary checks</text>

  <!-- row 1 -->
  <rect x="780" y="200" width="360" height="120" rx="14" class="bigbox"/>
  <text x="960" y="235" text-anchor="middle" class="label">Scheduler + tasks</text>
  <text x="960" y="258" text-anchor="middle" class="small">real-time scheduler</text>
  <text x="960" y="283" text-anchor="middle" class="tiny">ready queue · deadlines · TCBs · budgets</text>

  <rect x="1160" y="200" width="370" height="120" rx="14" class="bigbox"/>
  <text x="1345" y="235" text-anchor="middle" class="label">Timing guards</text>
  <text x="1345" y="258" text-anchor="middle" class="small">watchdog · deadline enforcement</text>
  <text x="1345" y="283" text-anchor="middle" class="tiny">WCET tracking</text>

  <!-- row 2 -->
  <rect x="780" y="340" width="750" height="150" rx="14" class="bigbox"/>
  <text x="1155" y="375" text-anchor="middle" class="label">IPC + CSpace capabilities</text>
  <text x="1155" y="400" text-anchor="middle" class="small">lookup, rights checks, revocation; no ambient authority</text>
  <rect x="797" y="430" width="170" height="40" rx="8" class="chip"/>
  <text x="882" y="456" text-anchor="middle" class="tiny">Endpoints</text>
  <rect x="979" y="430" width="170" height="40" rx="8" class="chip"/>
  <text x="1064" y="456" text-anchor="middle" class="tiny">Notifications</text>
  <rect x="1161" y="430" width="170" height="40" rx="8" class="chip"/>
  <text x="1246" y="456" text-anchor="middle" class="tiny">Shared memory</text>
  <rect x="1343" y="430" width="170" height="40" rx="8" class="chip"/>
  <text x="1428" y="456" text-anchor="middle" class="tiny">IRQ / MMIO / DMA</text>

  <!-- row 3 -->
  <rect x="780" y="510" width="360" height="160" rx="14" class="bigbox"/>
  <text x="960" y="545" text-anchor="middle" class="label">Memory management</text>
  <text x="960" y="570" text-anchor="middle" class="small">page tables · address spaces</text>
  <rect x="800" y="590" width="150" height="38" rx="8" class="chip"/>
  <text x="875" y="615" text-anchor="middle" class="tiny">PMM</text>
  <rect x="970" y="590" width="150" height="38" rx="8" class="chip"/>
  <text x="1045" y="615" text-anchor="middle" class="tiny">VMM</text>
  <text x="960" y="654" text-anchor="middle" class="tiny">ELF load + frame ownership stay in kernel</text>

  <rect x="1160" y="510" width="370" height="160" rx="14" class="bigbox"/>
  <text x="1345" y="545" text-anchor="middle" class="label">In-kernel VFS / drivers</text>
  <text x="1345" y="570" text-anchor="middle" class="small">still privileged today</text>
  <rect x="1180" y="590" width="104" height="38" rx="8" class="chip"/>
  <text x="1232" y="615" text-anchor="middle" class="tiny">VFS</text>
  <rect x="1296" y="590" width="104" height="38" rx="8" class="chip"/>
  <text x="1348" y="615" text-anchor="middle" class="tiny">Drivers</text>
  <rect x="1412" y="590" width="104" height="38" rx="8" class="chip"/>
  <text x="1464" y="615" text-anchor="middle" class="tiny">Terminal</text>
  <text x="1345" y="654" text-anchor="middle" class="tiny">serial · keyboard · RTC · framebuffer</text>

  <!-- architecture layer -->
  <rect x="780" y="690" width="750" height="40" rx="10" class="chip"/>
  <text x="1155" y="716" text-anchor="middle" class="tiny">Arch layer: x86_64 · ARM64 · RISC-V — boot, SMP/IPI, TLB shootdown</text>

  <!-- ================= HARDWARE ================= -->
  <rect x="40" y="790" width="1520" height="70" rx="18" class="hardware"/>
  <text x="800" y="822" text-anchor="middle" class="label">Hardware</text>
  <text x="800" y="847" text-anchor="middle" class="small">CPU · interrupt controller · timers · memory · serial · keyboard · devices · DMA</text>

  <!-- ================= ARROWS ================= -->
  <!-- user mode <-> syscall entry -->
  <path d="M540 250 L640 250" class="userarrow" marker-start="url(#arrowheadGreen)" marker-end="url(#arrowheadGreen)"/>
  <path d="M540 385 L640 385" class="userarrow" marker-start="url(#arrowheadGreen)" marker-end="url(#arrowheadGreen)"/>
  <path d="M540 590 L640 590" class="userarrow" marker-start="url(#arrowheadGreen)" marker-end="url(#arrowheadGreen)"/>

  <!-- entry -> subsystems -->
  <path d="M750 260 L780 260" class="kernelarrow" marker-end="url(#arrowheadBlue)"/>
  <path d="M750 415 L780 415" class="kernelarrow" marker-end="url(#arrowheadBlue)"/>
  <path d="M750 590 L780 590" class="kernelarrow" marker-end="url(#arrowheadBlue)"/>

  <!-- kernel -> hardware -->
  <path d="M960 750 L960 790" class="kernelarrow" marker-end="url(#arrowheadBlue)"/>
  <path d="M1345 750 L1345 790" class="kernelarrow" marker-end="url(#arrowheadBlue)"/>

  <!-- ================= FOOTNOTE ================= -->
  <rect x="50" y="885" width="1500" height="105" rx="10" class="note"/>
  <text x="800" y="915" text-anchor="middle" class="tiny" style="font-size:16px">Current state: hybrid kernel. VFS, devices, terminal and most of the hardware path are still kernel-owned by default.</text>
  <text x="800" y="940" text-anchor="middle" class="tiny" style="font-size:16px">Optional userspace service PDs are gated behind CONFIG_* options and stay in parity / strangler mode until the flip gates are met.</text>
  <text x="800" y="965" text-anchor="middle" class="tiny" style="font-size:16px">Target: a capability-based microkernel with isolated service PDs. This diagram shows what exists in the tree today.</text>
</svg>

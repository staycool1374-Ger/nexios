# Release Docker image for NexIOS milestone tags (issue #243).
#
# Builds ghcr.io/staycool1374-ger/nexios-env:<tag> (plus :latest on tags)
# for linux/amd64 + linux/arm64 via the default runner Buildx builder
# (no Build Cloud). Triggered by tag push (v*) and manually via
# workflow_dispatch (validates the chain without cutting a release).
# A failing image build never moves or deletes the git tag.
name: Release Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercase owner required by GHCR. Branch events (manual
          # dispatch) tag :<branch> so the loaded image has a name.
          images: ghcr.io/staycool1374-ger/nexios-env
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ github.event_name == 'workflow_dispatch' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # Dispatch (manual validation) must also push: the image is
          # built with `load` on the build runner, but dogfood runs on a
          # DIFFERENT runner, so a locally-loaded image is unreachable
          # there (proven 2026-09-28: "Unable to find image locally" +
          # GHCR HEAD denied). Branch tags (:main) are push-safe; release
          # tags additionally get :latest. A failing build never moves a
          # git tag either way.
          push: true
          load: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NEXIOS_TAG=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dogfood:
    # Validates the image contract: pull the pushed image (tags) or use
    # the locally loaded one (dispatch), then build + run one quick
    # class inside it. The image ref is :<ref-name> in both cases
    # (:v0.5.1 on tags via type=ref,event=tag; :<branch> on dispatch
    # via type=ref,event=branch).
    needs: build-push
    runs-on: ubuntu-24.04
    steps:
      - name: Pull release image
        run: docker pull ghcr.io/staycool1374-ger/nexios-env:${{ github.ref_name }}

      - name: make build inside the image
        run: docker run --rm ghcr.io/staycool1374-ger/nexios-env:${{ github.ref_name }} make build

      - name: Quick test class inside the image
        run: docker run --rm ghcr.io/staycool1374-ger/nexios-env:${{ github.ref_name }} make execute-test x86_64 debug debug_syscall

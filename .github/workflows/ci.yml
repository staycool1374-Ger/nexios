name: Jarvis RTOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Toolchain and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          nasm \
          xorriso \
          mtools \
          grub-pc-bin \
          grub-common \
          qemu-system-x86 \
          ovmf \
          expect \
          wget \
          meson \
          ninja-build

    - name: Locate OVMF firmware
      id: ovmf
      run: |
        # Ubuntu's ovmf package places the firmware under /usr/share/OVMF/
        # (not /usr/share/ovmf/). Resolve the path robustly so the build
        # always finds an existing pflash image regardless of packaging.
        for cand in /usr/share/OVMF/OVMF.fd \
                    /usr/share/ovmf/OVMF.fd \
                    /usr/share/qemu/OVMF.fd \
                    /usr/share/OVMF/OVMF_CODE.fd; do
          if [ -f "$cand" ]; then
            echo "firmware=$cand" >> "$GITHUB_OUTPUT"
            echo "Using OVMF firmware: $cand"
            exit 0
          fi
        done
        echo "ERROR: no OVMF firmware found" >&2
        find /usr/share -iname '*ovmf*' -o -iname 'OVMF*' 2>/dev/null >&2
        exit 1

    - name: Setup cross-compiler symlinks
      run: |
        sudo ln -sf /usr/bin/gcc /usr/local/bin/x86_64-elf-gcc
        sudo ln -sf /usr/bin/g++ /usr/local/bin/x86_64-elf-g++
        sudo ln -sf /usr/bin/ld /usr/local/bin/x86_64-elf-ld
        sudo ln -sf /usr/bin/ar /usr/local/bin/x86_64-elf-ar
        sudo ln -sf /usr/bin/objcopy /usr/local/bin/x86_64-elf-objcopy

    - name: Verify cross-compiler
      run: x86_64-elf-gcc --version

    # NOTE: Full test suites (selftest/all) are run manually before a
    # release — CI only verifies that the kernel compiles and links into
    # a bootable ISO for x86_64 (the riscv64 job below covers that arch).

    - name: Build Kernel (x86_64 Debug ISO)
      run: make debug QEMU_UEFI=${{ steps.ovmf.outputs.firmware }}

    - name: Build Kernel (x86_64 Release ISO)
      run: make release QEMU_UEFI=${{ steps.ovmf.outputs.firmware }}

    - name: Upload x86_64 Debug ISO
      uses: actions/upload-artifact@v4
      with:
        name: nexios-x86_64-debug-iso
        path: debug/nexios-rtos.iso
        retention-days: 7

  # Issue #222: riscv64 toolchain + gate. Separate job (not part of
  # `build`) so the fast x86_64 gate stays independent of the slower
  # riscv64 TCG wall time (~270 s per class measured). riscv64 emits a
  # raw BIN (no GRUB ISO — see #207), boots with QEMU `-bios default`
  # (no firmware), and needs no grub/xorriso/mtools.
  build-riscv64:
    runs-on: ubuntu-24.04
    # Two gate classes + rebuild under TCG: size generously (locally
    # ~270 s wall per class; GH runners are typically slower).
    timeout-minutes: 30

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install riscv64 Toolchain and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-riscv64-linux-gnu \
          g++-riscv64-linux-gnu \
          qemu-system-misc \
          expect \
          wget \
          meson \
          ninja-build

    - name: Verify riscv64 toolchain
      run: |
        riscv64-linux-gnu-gcc --version
        riscv64-linux-gnu-g++ --version | head -n 1
        riscv64-linux-gnu-objcopy --version | head -n 1
        qemu-system-riscv64 --version | head -n 1

    - name: Build Kernel (riscv64 Debug BIN)
      run: make debug ARCH=riscv64

    - name: Run riscv64 gate (arch_riscv64 + scheduler_zombie)
      run: make test-full riscv64 debug

    - name: Upload riscv64 Debug BIN
      uses: actions/upload-artifact@v4
      with:
        name: nexios-riscv64-debug-bin
        path: build/kernel-riscv64.bin
        retention-days: 7
